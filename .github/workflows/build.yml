name: Build NovaTV APKs From ZIP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Files and Enter Directory
        run: |
          unzip -o NovaTV_Pro_Native_Android_Project.zip
          if [ -d "NovaTV_Pro_Native_Android_Project" ]; then
            cd NovaTV_Pro_Native_Android_Project
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Phone & TV Debug APKs
        run: gradle assembleDebug --stacktrace

      - name: Upload Phone Remote APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaTV-Phone-Remote-APK
          path: '**/phone_app/build/outputs/apk/debug/phone_app-debug.apk'

      - name: Upload TV Receiver APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaTV-Screen-Receiver-APK
          path: '**/tv_app/build/outputs/apk/debug/tv_app-debug.apk'
          
